name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Runs on SQLite with a deterministic stand-in for the face engine, so
      # this job needs no database server and no 190 MB model download.
      # tests/test_face_engine.py skips itself automatically when the real
      # models are absent.
      - name: Run tests
        working-directory: backend
        run: pytest -q

  migration:
    name: Migration on PostgreSQL + pgvector
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose.yml: the vector extension is built in.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: allbee
          POSTGRES_PASSWORD: allbee
          POSTGRES_DB: allbee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allbee -d allbee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://allbee:allbee@localhost:5432/allbee
        run: alembic upgrade head

      # Guards the production search path: if the vector column or the HNSW
      # index stops being created, guest search silently degrades to a linear
      # scan instead of failing, so it has to be asserted explicitly.
      - name: Verify pgvector column and HNSW index
        env:
          PGPASSWORD: allbee
        run: |
          psql -h localhost -U allbee -d allbee -tAc \
            "SELECT udt_name FROM information_schema.columns
              WHERE table_name='faces' AND column_name='embedding';" | grep -qx vector
          echo "faces.embedding is a vector column"
          psql -h localhost -U allbee -d allbee -tAc \
            "SELECT indexdef FROM pg_indexes
              WHERE tablename='faces' AND indexname='ix_faces_embedding_hnsw';" \
            | grep -q "hnsw (embedding vector_cosine_ops)"
          echo "HNSW cosine index present"

      - name: Migration rolls back cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql://allbee:allbee@localhost:5432/allbee
        run: alembic downgrade base

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # Fonts are bundled from npm rather than fetched from Google, so this
      # build needs no outbound network beyond the registry.
      - name: Build
        working-directory: frontend
        run: npm run build
