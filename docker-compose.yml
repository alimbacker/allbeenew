# Local development services only.
#
# The application itself deliberately runs on the host, not in a container:
# photos live on the host filesystem, and keeping the app out of Docker means
# the storage directory behaves identically in development and in production.
#
# There is no AWS service here, and none is required anywhere in this project.

services:
  postgres:
    # pgvector/pgvector bundles the vector extension, so no build step and no
    # manual `CREATE EXTENSION` as superuser is needed.
    image: pgvector/pgvector:pg16
    container_name: allbee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allbee
      POSTGRES_PASSWORD: allbee
      POSTGRES_DB: allbee
      # Deterministic collation, so ORDER BY matches between machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - allbee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allbee -d allbee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  allbee-postgres:
    name: allbee-postgres
